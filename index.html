<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher's Adjustment System 2026-27</title>
    <style>
      @media print {
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        html, body { margin: 0 !important; padding: 0 !important; }
        body > * { display: none !important; }
        #print-area { display: block !important; }
        #print-area {
          position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
          margin: 0; padding: 10px 12px; box-sizing: border-box;
          background: white; overflow: hidden; font-family: Arial, sans-serif;
        }
        #print-area .school-header {
          display: flex; align-items: center; justify-content: center; gap: 14px;
          border-bottom: 3px double #1e293b; padding-bottom: 6px; margin-bottom: 4px;
        }
        #print-area .school-logo { width:62px;height:62px;border-radius:50%;border:2px solid #1e293b;object-fit:cover;flex-shrink:0; }
        #print-area .school-logo-placeholder { width:62px;height:62px;border-radius:50%;border:2px solid #1e293b;background:#1e293b;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;color:white; }
        #print-area .school-info { text-align: center; }
        #print-area .school-name-main { font-size:20px;font-weight:900;color:#1e293b;letter-spacing:1px;text-transform:uppercase;margin:0;line-height:1.1; }
        #print-area .school-name-main span { color: #dc2626; }
        #print-area .school-type { font-size:13px;font-weight:700;color:#1e40af;letter-spacing:2px;text-transform:uppercase;margin:1px 0; }
        #print-area .school-address { font-size:10px;color:#475569;margin:1px 0; }
        #print-area .reg-title { text-align:center;font-size:13px;font-weight:700;text-decoration:underline;text-transform:uppercase;letter-spacing:1px;margin:3px 0;color:#1e293b; }
        #print-area .date-bar { display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:#334155;margin-bottom:4px;padding:0 2px; }
        #print-area table { width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5px;font-family:Arial,sans-serif; }
        #print-area th { border:1.5px solid #334155!important;padding:4px 5px!important;background:#1e293b;color:white;font-weight:700;text-align:center; }
        #print-area td { border:1.5px solid #64748b!important;padding:3px 5px!important;overflow:hidden;word-break:break-word;vertical-align:middle; }
        #print-area .period-cell { background:#1e293b!important;color:white!important;text-align:center;font-weight:700; }
        #print-area .period-cell .p-label { font-size:12px;font-weight:800;display:block; }
        #print-area .period-cell .p-time { font-size:8.5px;font-weight:400;color:#94a3b8;display:block;margin-top:1px; }
        #print-area .row-class { background:#fffbeb!important;color:#92400e;font-weight:700;font-size:10px;white-space:nowrap; }
        #print-area .row-sub { background:#f0fdf4!important;color:#166534;font-weight:700;font-size:10px;white-space:nowrap; }
        #print-area .row-sign { background:#faf5ff!important;color:#6b21a8;font-weight:700;font-size:10px;white-space:nowrap; }
        #print-area .val-class { display:block;text-align:center;font-weight:800;color:#1e40af;font-size:11px; }
        #print-area .val-sub { display:block;text-align:center;font-weight:700;color:#166534;font-size:11px; }
        #print-area .val-free { display:block;text-align:center;color:#94a3b8;font-style:italic;font-size:10px; }
        #print-area .sign-space { display:block;height:18px; }
        #print-area .break-row td { background:#fef9c3!important;text-align:center;font-weight:700;color:#854d0e;font-size:10px;padding:3px!important;border:1.5px solid #ca8a04!important; }
        #print-area .footer-row td { background:#f8fafc!important;font-weight:700;font-size:11px;color:#1e293b;padding:4px 6px!important;height:26px; }
        table { page-break-inside: avoid; }
        tr { page-break-inside: avoid; }
      }
      @media screen { #print-area { display: none; } }
      .spinner { width:48px;height:48px;border:5px solid #e2e8f0;border-top-color:#1e293b;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-area"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
